[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sychoa"
version = "0.1.0"
description = "Qt app for marking address-specific highlight boxes on a PDF and exporting marked-up PDFs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24",
  "PySide6>=6.7",
]

[project.scripts]
sychoa = "sychoa.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sychoa"]
